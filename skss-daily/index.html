<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SKSS Daily</title>
<meta name="description" content="毎朝30秒〜1分で、前日の振り返りと今日の目標を記録するシンプルな日次ログ">

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#3f6a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SKSS Daily">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#f6f2e9; --paper:#fffdf8; --ink:#2c372e; --ink-soft:#5c6a5d; --line:#e3ddcd;
    --sprout:#5b8a5a; --sprout-deep:#3f6a44; --sprout-soft:#e7efe1; --sprout-line:#cfe0c6;
    --clay:#b96b3e; --clay-deep:#9a5128; --clay-soft:#f6e4d6; --clay-line:#ecccb2;
    --shadow:0 12px 34px -20px rgba(44,55,46,.45); --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;color:var(--ink);background:var(--bg);
    background-image:
      radial-gradient(760px 480px at 8% -10%, rgba(91,138,90,.10), transparent 60%),
      radial-gradient(700px 520px at 105% 4%, rgba(185,107,62,.08), transparent 60%);
    line-height:1.6;letter-spacing:.01em;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .shell{max-width:640px;margin:0 auto;padding:18px 16px 48px;}

  /* app header */
  .app-header{text-align:center;padding:18px 16px 6px;}
  .app-header .brand{display:inline-flex;align-items:center;gap:8px;
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:19px;color:var(--sprout-deep);}
  .app-header .brand .emojis{font-size:16px;letter-spacing:1px;}

  button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;}
  input,textarea{font:inherit;color:inherit;}

  /* top summary */
  .top-summary{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:14px 18px;margin-bottom:16px;}
  .date-badge{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:16.5px;}
  .week-badge{font-size:13px;font-weight:700;color:var(--clay-deep);background:var(--clay-soft);
    border:1px solid var(--clay-line);border-radius:999px;padding:6px 12px;white-space:nowrap;}

  /* cards */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:18px;margin-bottom:14px;}
  .card-title{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:15.5px;margin-bottom:2px;}
  .card-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;}

  /* category block */
  .cat-block{margin-bottom:16px;}
  .cat-block:last-child{margin-bottom:0;}
  .cat-label{display:flex;align-items:baseline;gap:8px;font-family:"Zen Maru Gothic",sans-serif;
    font-weight:700;font-size:14.5px;margin-bottom:8px;}
  .cat-label span:first-of-type{color:var(--sprout-deep);white-space:nowrap;flex-shrink:0;}
  .cat-hint{font-family:"Zen Kaku Gothic New",sans-serif;font-weight:400;font-size:11.5px;color:var(--ink-soft);}

  .chip-list{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;}
  .chip-list:empty{margin-bottom:0;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--sprout-soft);
    border:1px solid var(--sprout-line);border-radius:999px;padding:7px 8px 7px 13px;font-size:13.5px;
    max-width:100%;}
  .chip span{overflow-wrap:anywhere;}
  .chip-thumb{width:24px;height:24px;border-radius:7px;object-fit:cover;flex-shrink:0;cursor:zoom-in;
    margin-left:-6px;}
  .chip-remove{width:22px;height:22px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:14px;color:var(--sprout-deep);background:rgba(255,255,255,.6);}
  .chip-remove:hover{background:#fff;}

  .add-row{display:flex;gap:8px;}
  .add-row input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;
    padding:11px 13px;font-size:16px;background:#fff;}
  .add-row input:focus{outline:2px solid var(--sprout-line);outline-offset:1px;border-color:var(--sprout);}
  .add-btn,.img-btn{flex-shrink:0;width:44px;height:44px;border-radius:12px;font-size:18px;
    display:flex;align-items:center;justify-content:center;}
  .add-btn{background:var(--sprout-soft);border:1.5px solid var(--sprout-line);color:var(--sprout-deep);
    font-size:20px;font-weight:700;}
  .add-btn:active{background:var(--sprout-line);}
  .img-btn{background:#fff;border:1.5px solid var(--line);color:var(--ink-soft);}
  .img-btn.has-image{background:var(--clay-soft);border-color:var(--clay-line);color:var(--clay-deep);}
  .img-btn:active{background:var(--sprout-soft);}

  .pending-preview{display:flex;align-items:center;gap:8px;margin-top:8px;}
  .pending-preview:empty{display:none;margin-top:0;}
  .pending-thumb{width:40px;height:40px;border-radius:10px;object-fit:cover;}
  .pending-remove{width:24px;height:24px;flex-shrink:0;border-radius:50%;background:#fff;
    border:1px solid var(--line);color:var(--ink-soft);font-size:13px;display:flex;
    align-items:center;justify-content:center;}

  .lightbox{position:fixed;inset:0;background:rgba(20,26,20,.85);display:flex;align-items:center;
    justify-content:center;padding:24px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  .lightbox.show{opacity:1;pointer-events:auto;}
  .lightbox img{max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);
    cursor:zoom-out;}

  /* confirmation checks (MF / mindmap / …) */
  .check-row{display:flex;align-items:center;gap:12px;min-height:44px;cursor:pointer;font-size:14.5px;font-weight:700;
    font-family:"Zen Maru Gothic",sans-serif;}
  .check-row input[type="checkbox"]{width:22px;height:22px;accent-color:var(--sprout-deep);flex-shrink:0;}
  .check-row + .check-row{margin-top:2px;padding-top:10px;border-top:1px solid var(--line);}

  /* goal */
  .goal-card textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;
    font-size:16px;background:#fff;resize:vertical;min-height:64px;}
  .goal-card textarea:focus{outline:2px solid var(--clay-line);outline-offset:1px;border-color:var(--clay);}

  .goal-edit{margin:14px 0;}
  .goal-edit textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;
    font-size:16px;background:#fff;resize:vertical;min-height:56px;}

  /* save */
  .save-bar{position:sticky;bottom:0;padding:10px 0 4px;background:linear-gradient(to top, var(--bg) 60%, transparent);}
  .btn-save{width:100%;min-height:52px;border-radius:14px;background:var(--sprout-deep);color:#fff;
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:16px;box-shadow:0 10px 26px -12px rgba(63,106,68,.6);}
  .btn-save:active{background:var(--sprout);}
  .btn-save.small{width:100%;min-height:44px;font-size:14px;margin-top:4px;border-radius:12px;}

  .link-btn{display:block;width:100%;text-align:center;padding:12px;margin-top:6px;
    color:var(--ink-soft);font-size:13.5px;font-weight:700;text-decoration:underline;
    text-underline-offset:3px;min-height:44px;}

  /* logs view */
  .logs-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .back-btn{min-height:40px;padding:8px 14px;border-radius:999px;background:var(--paper);
    border:1px solid var(--line);font-weight:700;font-size:13.5px;box-shadow:var(--shadow);}
  .logs-title{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:16px;}

  .section-label{font-size:12.5px;color:var(--ink-soft);font-weight:700;margin:18px 2px 8px;}
  .section-label:first-child{margin-top:0;}

  .log-row{background:var(--paper);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;}
  .log-row.expanded{border-color:var(--sprout-line);}
  .log-row-head{display:flex;align-items:center;gap:10px;width:100%;padding:13px 16px;min-height:44px;text-align:left;}
  .log-date{font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px;flex-shrink:0;}
  .today-tag{font-size:10.5px;font-weight:700;background:var(--sprout-soft);color:var(--sprout-deep);
    border-radius:999px;padding:2px 8px;}
  .log-counts{flex:1;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;font-size:12.5px;color:var(--ink-soft);}
  .mini-count{background:var(--bg);border-radius:999px;padding:2px 8px;}
  .mini-check{background:var(--clay-soft);color:var(--clay-deep);border-radius:999px;padding:2px 8px;font-weight:700;}
  .log-caret{color:var(--ink-soft);font-size:11px;flex-shrink:0;}
  .log-row-body{padding:4px 16px 16px;border-top:1px solid var(--line);}
  .log-row-body .cat-block{margin-top:14px;}

  .month-group{background:var(--paper);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);margin-bottom:10px;overflow:hidden;}
  .month-group.expanded{border-color:var(--sprout-line);}
  .month-head{display:flex;align-items:center;gap:10px;width:100%;padding:13px 16px;min-height:44px;text-align:left;}
  .month-label{font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:14px;flex-shrink:0;}
  .month-meta{flex:1;text-align:right;font-size:12px;color:var(--ink-soft);}
  .month-body{padding:12px 12px 2px;border-top:1px solid var(--line);background:var(--bg);}
  .month-body .log-row{margin-bottom:8px;}

  .backup-row{display:flex;gap:10px;margin-bottom:16px;}
  .backup-btn{display:flex;align-items:center;justify-content:center;gap:7px;flex:1;
    min-height:46px;border-radius:14px;background:var(--paper);border:1.5px solid var(--sprout-line);
    color:var(--sprout-deep);font-weight:700;font-size:13px;box-shadow:var(--shadow);text-align:center;
    padding:0 6px;}
  .backup-btn:active{background:var(--sprout-soft);}

  .month-export .backup-row{margin-bottom:0;gap:8px;}
  .month-export .backup-btn{gap:4px;padding:0 4px;font-size:12.5px;white-space:nowrap;box-shadow:none;}
  .month-select{width:100%;min-height:44px;border-radius:12px;border:1.5px solid var(--sprout-line);
    background:var(--paper);color:var(--ink);font-size:14px;font-weight:700;padding:0 12px;margin-bottom:12px;}

  .empty-note{font-size:12.5px;color:var(--ink-soft);text-align:center;padding:10px;}
  .memory-list{padding-left:22px;font-size:13.5px;}
  .memory-list li{margin:3px 0;}

  /* GitHub sync */
  .sync-status{display:flex;align-items:center;gap:8px;min-height:40px;padding:9px 14px;margin-bottom:8px;
    border-radius:12px;font-size:13.5px;font-weight:700;border:1.5px solid var(--line);background:var(--paper);
    color:var(--ink-soft);overflow-wrap:anywhere;}
  .sync-status:empty{display:none;}
  .sync-status.ok{background:var(--sprout-soft);border-color:var(--sprout-line);color:var(--sprout-deep);}
  .sync-status.error{background:#fbe5e1;border-color:#efb7ab;color:#a3321f;}
  .sync-status.busy{background:#fff;}
  .sync-card input{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;
    padding:11px 13px;font-size:16px;background:#fff;margin-bottom:10px;}
  .sync-card input:focus{outline:2px solid var(--sprout-line);outline-offset:1px;border-color:var(--sprout);}
  .sync-card .backup-row{margin-bottom:0;}
  .sync-card .backup-btn{min-height:48px;box-shadow:none;font-size:14px;}
  .sync-card .backup-btn.primary{background:var(--sprout-deep);border-color:var(--sprout-deep);color:#fff;}
  .sync-card .backup-btn.danger{border-color:#efb7ab;color:#a3321f;}

  /* toast */
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--sprout-deep);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;
    font-weight:700;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);opacity:0;pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;z-index:50;white-space:nowrap;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  @media(min-width:720px){
    .shell{max-width:680px;padding-top:28px;}
    .card{padding:22px 24px;}
    .cat-block{display:grid;grid-template-columns:170px 1fr;column-gap:18px;align-items:start;}
    .cat-label{margin-bottom:0;}
    .cat-block .chip-list,.cat-block .add-row{grid-column:2;}
    .cat-block .chip-list:empty + .add-row{grid-row:2;}
  }
</style>
</head>
<body>

<div class="app-header">
  <div class="brand"><span class="emojis">🌱🌳🌿🌸</span> SKSS Daily</div>
</div>

<div class="shell">
  <div id="app"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="lightbox" class="lightbox"><img id="lightbox-img" src="" alt="添付画像の拡大表示"></div>

<script>
"use strict";

/* ---------- date utils ---------- */
function pad2(n){ return String(n).padStart(2,"0"); }
function toKey(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function todayKey(){ return toKey(new Date()); }
function keyToDate(key){ const [y,m,d] = key.split("-").map(Number); return new Date(y, m-1, d); }
function addDays(key, n){ const d = keyToDate(key); d.setDate(d.getDate()+n); return toKey(d); }
const WEEKDAYS_JA = ["日","月","火","水","木","金","土"];
function formatJP(key){
  const d = keyToDate(key);
  return `${d.getMonth()+1}月${d.getDate()}日(${WEEKDAYS_JA[d.getDay()]})`;
}
function mondayOf(key){
  const d = keyToDate(key);
  const day = d.getDay();
  const diff = (day === 0 ? -6 : 1 - day);
  d.setDate(d.getDate() + diff);
  return toKey(d);
}
function isInWeek(dateKey, mondayKey){
  return dateKey >= mondayKey && dateKey <= addDays(mondayKey, 6);
}

/* ---------- storage (localStorage now; swap-friendly for IndexedDB/Supabase later) ---------- */
const STORAGE_KEY = "skssDaily.v1.entries";

/* ---------- categories ---------- */
const CATEGORIES = [
  { key: "seed",   emoji: "🌱", label: "種", hint: "思いついたこと・アイデア" },
  { key: "root",   emoji: "🌳", label: "根", hint: "方向性が固まった・調べた・整理した" },
  { key: "branch", emoji: "🌿", label: "枝", hint: "制作や作業が進んだこと" },
  { key: "bloom",  emoji: "🌸", label: "咲", hint: "公開・完成・納品など、外に出たもの" },
];

const CHECKS = [
  { key: "mf",      emoji: "💰", label: "MF確認済み",             badge: "💰済" }, // source: future 'moneyforward-api' etc.
  { key: "mindmap", emoji: "🧠", label: "マインドマップ確認済み", badge: "🧠済" },
];

function createEmptyEntry(dateKey){
  const entry = {
    date: dateKey,
    todayGoal: "",
    memo: "",
    updatedAt: null,
  };
  for (const c of CATEGORIES) entry[c.key] = [];
  for (const c of CHECKS) entry[c.key] = { checked: false, checkedAt: null, source: "manual" };
  return entry;
}

// a category item is { text, image }; image is a compressed data URL or null
function normalizeItem(item){
  return typeof item === "string" ? { text: item, image: null } : { text: item.text || "", image: item.image || null };
}

// fills in any check/category fields missing or in an older shape from before image
// attachments and the MF check existed, so old saved entries keep working unchanged
function normalizeEntry(raw, dateKey){
  const entry = { ...createEmptyEntry(dateKey), ...raw };
  for (const c of CATEGORIES) entry[c.key] = (raw[c.key] || []).map(normalizeItem);
  for (const c of CHECKS) entry[c.key] = { ...createEmptyEntry(dateKey)[c.key], ...(raw[c.key] || {}) };
  // "memo" briefly shipped as a chip-list category before becoming a free-text field —
  // fold any already-added items into the text so nothing typed in that window is lost
  if (Array.isArray(raw.memo)) {
    entry.memo = raw.memo.map(normalizeItem).map((i) => i.text).filter(Boolean).join("\n");
  }
  // migrate the old "freee" check (freee -> MoneyForward) so already-checked days aren't lost
  if (!raw.mf && raw.freee) entry.mf = { ...createEmptyEntry(dateKey).mf, ...raw.freee };
  delete entry.freee;
  return entry;
}

const Store = {
  _readAll(){
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      console.error("SKSS Daily: failed to read storage", e);
      return {};
    }
  },
  _writeAll(all){
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
      return true;
    } catch (e) {
      console.error("SKSS Daily: failed to write storage", e);
      if (typeof showToast === "function") {
        showToast(e && e.name === "QuotaExceededError" ? "⚠ 容量が上限です。画像を減らしてください" : "⚠ 保存に失敗しました");
      }
      return false;
    }
  },
  get(dateKey){
    const all = this._readAll();
    return all[dateKey] ? normalizeEntry(all[dateKey], dateKey) : createEmptyEntry(dateKey);
  },
  save(entry){
    const all = this._readAll();
    entry.updatedAt = new Date().toISOString();
    all[entry.date] = entry;
    this._writeAll(all);
    return entry;
  },
  list(){
    return Object.values(this._readAll())
      .map((raw) => normalizeEntry(raw, raw.date))
      .sort((a, b) => b.date.localeCompare(a.date));
  },
};

function weeklyBloomCount(refKey){
  const monday = mondayOf(refKey || todayKey());
  let count = 0;
  for (const e of Store.list()) {
    if (isInWeek(e.date, monday)) count += (e.bloom ? e.bloom.length : 0);
  }
  return count;
}

/* ---------- in-memory entry cache ---------- */
const entriesCache = {};
function getEntry(date){
  if (!entriesCache[date]) entriesCache[date] = Store.get(date);
  return entriesCache[date];
}
function persistEntry(date){
  Store.save(getEntry(date));
}

/* ---------- GitHub sync ----------
   The token lives only in this browser's localStorage — never in this file or any repo.
   Data goes to a separate PRIVATE repo, since this app's own repo is public. */
const GITHUB = { owner: "ginsprout", repo: "skss-daily-data", path: "entries.json" };
const TOKEN_KEY = "skssDaily.githubToken";
const GITHUB_URL = `https://api.github.com/repos/${GITHUB.owner}/${GITHUB.repo}/contents/${GITHUB.path}`;

class SyncError extends Error {
  constructor(message, status){ super(message); this.status = status; }
}

function base64ToUtf8(b64){
  const bin = atob(b64.replace(/\s/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
}
function utf8ToBase64(text){
  const bytes = new TextEncoder().encode(text);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

// per day, keep whichever side was edited more recently
function mergeEntries(local, remote){
  const merged = { ...local };
  for (const [key, raw] of Object.entries(remote)) {
    if (!raw || typeof raw !== "object") continue;
    const mine = local[key];
    if (!mine || (raw.updatedAt || "") > (mine.updatedAt || "")) merged[key] = raw;
  }
  return merged;
}

const Sync = {
  status: { kind: "", text: "" }, // kind: "" | "busy" | "ok" | "error"
  _busy: false,
  _again: false,

  getToken(){
    try { return localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; }
  },
  setToken(token){
    try { localStorage.setItem(TOKEN_KEY, token); } catch (e) { /* storage blocked: stays unconnected */ }
  },
  clearToken(){
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) { /* nothing to clear */ }
  },
  connected(){ return !!this.getToken(); },

  setStatus(kind, text){
    this.status = { kind, text };
    document.querySelectorAll("[data-sync-status]").forEach((el) => {
      el.className = `sync-status ${kind}`;
      el.textContent = text;
    });
  },

  async _fetch(method, { accept = "application/vnd.github+json", body } = {}){
    let res;
    try {
      res = await fetch(GITHUB_URL, {
        method,
        cache: "no-store",
        headers: {
          Authorization: `Bearer ${this.getToken()}`,
          Accept: accept,
          "X-GitHub-Api-Version": "2022-11-28",
          ...(body ? { "Content-Type": "application/json" } : {}),
        },
        body: body ? JSON.stringify(body) : undefined,
      });
    } catch (e) {
      throw new SyncError("ネットにつながっていないようです", 0);
    }
    if (res.status === 401) throw new SyncError("トークンが正しくないか、期限切れです", 401);
    if (res.status === 403 || res.status === 404) throw new SyncError("データ用リポジトリに入れません。トークンの権限を確認してください", res.status);
    if (res.status === 409 || res.status === 422) throw new SyncError("ほかの端末と同時に保存されました", 409);
    if (!res.ok) throw new SyncError(`GitHubがエラーを返しました（${res.status}）`, res.status);
    return res;
  },

  // returns { sha, entries } for the latest entries.json on GitHub
  async _pull(){
    const meta = await (await this._fetch("GET")).json();
    let text;
    if (meta.content) {
      text = base64ToUtf8(meta.content);
    } else {
      // over 1MB the API leaves `content` empty, so fetch the raw file instead
      text = await (await this._fetch("GET", { accept: "application/vnd.github.raw+json" })).text();
    }
    const data = text.trim() ? JSON.parse(text) : {};
    const entries = data.entries && typeof data.entries === "object" ? data.entries : {};
    return { sha: meta.sha, entries };
  },

  // merges GitHub's copy into this device; returns true if anything here changed
  _applyRemote(remoteEntries){
    const local = Store._readAll();
    const merged = mergeEntries(local, remoteEntries);
    const changed = JSON.stringify(merged) !== JSON.stringify(local);
    if (changed && Store._writeAll(merged)) {
      for (const key of Object.keys(entriesCache)) delete entriesCache[key];
    }
    return changed;
  },

  _refreshView(){
    // don't yank the page out from under someone who's mid-typing
    const active = document.activeElement;
    if (active && app.contains(active) && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) return;
    render();
  },

  async load(){
    if (!this.connected()) return;
    this.setStatus("busy", "☁ GitHubから読み込み中…");
    try {
      const { entries } = await this._pull();
      if (this._applyRemote(entries)) this._refreshView();
      this.setStatus("ok", `✓ GitHubから最新を読み込みました（${clockNow()}）`);
      return true;
    } catch (e) {
      console.error("SKSS Daily: GitHub load failed", e);
      this.setStatus("error", `⚠ GitHubから読み込めませんでした：${e instanceof SyncError ? e.message : "データの形式が正しくありません"}`);
      return false;
    }
  },

  async save(){
    if (!this.connected()) return;
    if (this._busy) { this._again = true; return; } // a second tap while saving just queues one more push
    this._busy = true;
    this.setStatus("busy", "☁ GitHubに保存中…");
    try {
      for (let attempt = 0; ; attempt++) {
        try {
          // pull first so edits made on the other device aren't overwritten
          const { sha, entries } = await this._pull();
          if (this._applyRemote(entries)) this._refreshView();
          const all = Store._readAll();
          const content = JSON.stringify({ app: "skss-daily", schemaVersion: 1, exportedAt: new Date().toISOString(), entries: all }, null, 2);
          await this._fetch("PUT", { body: {
            message: `Update SKSS Daily (${todayKey()})`,
            content: utf8ToBase64(content + "\n"),
            sha,
          } });
          break;
        } catch (e) {
          if (e instanceof SyncError && e.status === 409 && attempt < 2) continue;
          throw e;
        }
      }
      this.setStatus("ok", `✓ GitHubに保存しました（${clockNow()}）`);
    } catch (e) {
      console.error("SKSS Daily: GitHub save failed", e);
      this.setStatus("error", `⚠ GitHubに保存できませんでした：${e instanceof SyncError ? e.message : "データの形式が正しくありません"}。この端末には保存済みです`);
    } finally {
      this._busy = false;
      if (this._again) { this._again = false; this.save(); }
    }
  },
};

function clockNow(){
  const d = new Date();
  return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
}

async function handleConnectGithub(){
  const input = document.getElementById("github-token-input");
  const token = input ? input.value.trim() : "";
  if (!token) { input?.focus(); return; }
  Sync.setToken(token);
  if (await Sync.load()) {
    render(); // swap the setup card for the connected one

    Sync.clearToken();
    render();
  }

// downscales + re-encodes as JPEG so a multi-MB camera photo doesn't blow the
// localStorage quota — everything here stays a small (tens of KB) data URL
function readAndCompressImage(file, maxDim = 800, quality = 0.6){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(reader.error || new Error("read failed"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("decode failed"));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

const state = {
  view: "today",       // 'today' | 'logs'
  expandedDate: null,

/* ---------- month helpers ---------- */
function formatMonthJP(monthKey){
  const [y, m] = monthKey.split("-").map(Number);
  return `${y}年${m}月`;
}

// months that have at least one record, plus this month — newest first, with day counts
function exportableMonths(){
  const counts = new Map([[todayKey().slice(0, 7), 0]]);
  for (const key of Object.keys(Store._readAll())) {
    const mk = key.slice(0, 7);
    counts.set(mk, (counts.get(mk) || 0) + 1);
  }
  return Array.from(counts.entries()).sort((a, b) => b[0].localeCompare(a[0]));
}

/* ---------- escaping ---------- */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function renderMonthGroup(monthKey, entries){

  const bloomCount = entries.reduce((sum, e) => sum + (e.bloom ? e.bloom.length : 0), 0);
  return `

      <button type="button" class="month-head" data-action="toggle-month" data-month="${monthKey}">

        <span class="month-meta">${entries.length}件 ・ 🌸${bloomCount}</span>
        <span class="log-caret">${expanded ? "▲" : "▼"}</span>
      </button>
      ${expanded ? `<div class="month-body">${entries.map((e) => renderLogRow(e.date)).join("")}</div>` : ""}
    </div>`;
}

/* ---------- mutations ---------- */
// Adding an item patches the DOM in place instead of calling render() (which would
// replace the whole app innerHTML, including this very input). Rebuilding the input
// node while the browser's IME composition for the just-confirmed text is still
// settling caused leftover conversion text to appear in the (new) input afterward.
// Keeping the same node alive avoids that race and also means the field never loses
// focus, which is nicer for adding several items in a row.
function handleAddItem(scope, date, cat, inputId){
  const input = document.getElementById(inputId);
  if (!input) return;
  const text = input.value.trim();
  const image = pendingImages.get(inputId) || null;
  if (!text && !image) { input.focus(); return; }
  const entry = getEntry(date);
  const index = entry[cat].length;
  const item = { text, image };
  entry[cat].push(item);
  persistEntry(date);
  input.value = "";
  pendingImages.delete(inputId);
  renderPendingPreview(inputId);
  patchAfterAdd(input, date, cat, index, item);
}

function patchAfterAdd(input, date, cat, index, item){
  const list = input.closest(".cat-block")?.querySelector(".chip-list");
  if (list) {
    const li = document.createElement("li");
    li.className = "chip";
    if (item.image) {
      const img = document.createElement("img");
      img.className = "chip-thumb";
      img.src = item.image;
      img.alt = "添付画像";
      img.dataset.action = "view-image";
      li.appendChild(img);
    }
    const span = document.createElement("span");
    span.textContent = item.text;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip-remove";
    btn.dataset.action = "remove-item";
    btn.dataset.date = date;
    btn.dataset.cat = cat;
    btn.dataset.index = String(index);
    btn.setAttribute("aria-label", "削除");
    btn.textContent = "×";
    li.append(span, btn);
    list.appendChild(li);
  }

  if (cat === "bloom") {
    const label = `🌸 今週 ${weeklyBloomCount()}件`;
    document.querySelectorAll(".week-badge").forEach((el) => { el.textContent = label; });
  }

  const miniCount = input.closest(".log-row")?.querySelector(`.mini-count[data-cat="${cat}"]`);
  if (miniCount) {
    const emoji = CATEGORIES.find((c) => c.key === cat).emoji;
    const current = parseInt(miniCount.textContent.replace(/\D/g, ""), 10) || 0;
    miniCount.textContent = `${emoji}${current + 1}`;
  }
}

async function handlePickImage(fileEl){
  const file = fileEl.files && fileEl.files[0];
  if (!file) return;
  const inputId = fileEl.dataset.for;
  try {
    pendingImages.set(inputId, await readAndCompressImage(file));
    renderPendingPreview(inputId);
  } catch (err) {
    console.error("SKSS Daily: image processing failed", err);
    showToast("⚠ 画像を読み込めませんでした");
  } finally {
    fileEl.value = ""; // allow re-selecting the same file later
  }
}

function renderPendingPreview(inputId){
  const container = document.getElementById(`pending-${inputId}`);
  const fileInput = document.getElementById(`${inputId}-file`);
  const camBtn = fileInput && fileInput.nextElementSibling;
  const dataUrl = pendingImages.get(inputId);
  if (camBtn) camBtn.classList.toggle("has-image", !!dataUrl);
  if (!container) return;
  container.innerHTML = "";
  if (!dataUrl) return;
  const img = document.createElement("img");
  img.className = "pending-thumb";
  img.src = dataUrl;
  img.alt = "添付予定の画像";
  const removeBtn = document.createElement("button");
  removeBtn.type = "button";
  removeBtn.className = "pending-remove";
  removeBtn.textContent = "×";
  removeBtn.setAttribute("aria-label", "画像を外す");
  removeBtn.dataset.action = "clear-pending-image";
  removeBtn.dataset.input = inputId;
  container.append(img, removeBtn);
}

function handleToggleCheck(date, field, checked){
  const entry = getEntry(date);
  entry[field].checked = checked;
  entry[field].checkedAt = checked ? new Date().toISOString() : null;
  persistEntry(date);
  render();
}

function handleEditGoal(date, value){
  const entry = getEntry(date);
  entry.todayGoal = value;
  persistEntry(date);
}

function handleEditMemo(date, value){
  const entry = getEntry(date);
  entry.memo = value;
  persistEntry(date);
}

// month: "YYYY-MM" to export just that month (same file shape, so it imports as-is), or omit for everything
function handleExportBackup(month){
  const all = Store._readAll();
  const entries = month
    ? Object.fromEntries(Object.entries(all).filter(([key]) => key.startsWith(`${month}-`)))
    : all;
  const data = {
    app: "skss-daily",
    schemaVersion: 1,
    exportedAt: new Date().toISOString(),
    entries,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = month ? `skss-daily-${month}.json` : `skss-daily-backup-${todayKey()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast(month ? `✓ ${formatMonthJP(month)}分をダウンロードしました` : "✓ バックアップをダウンロードしました");
}

function buildChatText(month){
  let entries, title, request;
  if (month) {
    entries = Store.list().filter(e => e.date.startsWith(`${month}-`)).reverse(); // oldest first
    title = formatMonthJP(month);
    request = "この月の記録を読んで、進んだこと・気になったことを具体的にコメントして。";
  } else {
    const cutoff = addDays(todayKey(), -13);
    entries = Store.list().filter(e => e.date >= cutoff && e.date <= todayKey());
    title = "直近14日";
    request = "最近の進捗を読んで、進んだこと・気になったことを具体的にコメントして。";
  }
  return `【SKSS Daily：${title}】\n${entries.length ? entries.map(e => {
    const lines = [`■ ${e.date}`];
    for (const c of CATEGORIES) {
      const items = e[c.key].map(i => i.text).filter(Boolean);
      if (items.length) lines.push(`${c.emoji}${c.label}：${items.join("／")}`);
    }
    if (e.todayGoal) lines.push(`今日の咲候補：${e.todayGoal}`);
    if (e.memo) lines.push(`メモ：${e.memo}`);
    return lines.join("\n");
  }).join("\n\n") : "記録はまだありません"}\n\n${request}記録がない日は停滞と決めつけず、必要なら私に聞いてください。会話しながら訂正します。`;
}

async function handleCopyChat(month){
  const value = buildChatText(month);
  try {
    await navigator.clipboard.writeText(value);
    showToast("✓ コピーしました。ChatGPTに貼り付けてね");
  } catch (e) {
    const field = document.createElement("textarea");
    field.value = value;
    field.style.cssText = "position:fixed;inset:10%;width:80%;height:70%;z-index:100;background:white;padding:16px";
    field.setAttribute("aria-label", "チャトピーに渡す日報。全選択してコピーしてください");
    document.body.appendChild(field);
    field.focus(); field.select();
    showToast("文章を選択しました。コピーしてください");
    field.addEventListener("blur", () => field.remove(), { once: true });
  }
}

async function handleImportBackup(file){
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== "skss-daily" || data.schemaVersion !== 1 ||
        !data.entries || typeof data.entries !== "object" || Array.isArray(data.entries)) throw new Error("format");
    const imported = {};
    for (const [key, raw] of Object.entries(data.entries)) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(key) || !raw || typeof raw !== "object" || raw.date !== key ||
          CATEGORIES.some(c => !Array.isArray(raw[c.key] || []))) throw new Error("entry");
      imported[key] = normalizeEntry(raw, key);
    }
    const existing = Store._readAll();
    const collisions = Object.keys(imported).filter(key => key in existing);
    const message = `${Object.keys(imported).length}日分を読み込みます。${collisions.length ? `同じ日付が${collisions.length}日あります。読み込んだファイルの内容で上書きします。` : ""}先にこの端末のJSONを保存しておくと安心です。続けますか？`;
    if (!window.confirm(message)) return;
    if (Store._writeAll({ ...existing, ...imported })) {
      for (const key of Object.keys(entriesCache)) delete entriesCache[key];
      state.expandedDate = null; state.expandedMonth = null;
      render();
      showToast(`✓ ${Object.keys(imported).length}日分を読み込みました`);
    }
  } catch (e) {
    console.error("SKSS Daily: import failed", e);
    showToast("⚠ SKSS DailyのJSONを選んでください");
  }
}

// A self-contained, human-readable page for skimming or "print to PDF" — kept as
// plain HTML rather than pulling in a PDF library, per the app's no-dependency rule.
// month: "YYYY-MM" for just that month in date order (oldest first), or omit for everything (newest first)
function buildPrintableHtml(month){
  const entries = month
    ? Store.list().filter((e) => e.date.startsWith(`${month}-`)).reverse()
    : Store.list();
  const heading = month ? `${formatMonthJP(month)}の記録` : "バックアップ";
  const rows = entries.map((e) => {
    const catsHtml = CATEGORIES.map((c) => {
      const items = e[c.key] || [];
      const body = items.length
        ? `<ul>${items.map((i) => `<li>${esc(i.text)}${i.image ? ` <img class="pv-thumb" src="${i.image}" alt="">` : ""}</li>`).join("")}</ul>`
        : `<p class="empty">(なし)</p>`;
      return `<div class="cat"><h3>${c.emoji} ${esc(c.label)}</h3>${body}</div>`;
    }).join("");
    const checksHtml = CHECKS.map((c) => `<span>${c.emoji} ${esc(c.label)}：${e[c.key].checked ? "✓" : "−"}</span>`).join("　");
    return `
      <section class="entry">
        <h2>${esc(formatJP(e.date))}</h2>
        ${catsHtml}
        <p class="checks">${checksHtml}</p>
        <p class="goal"><strong>🌸 今日の咲候補：</strong>${e.todayGoal ? esc(e.todayGoal) : "(未設定)"}</p>
        ${e.memo ? `<p class="goal"><strong>📝 メモ：</strong>${esc(e.memo)}</p>` : ""}
      </section>`;
  }).join("");

  return `<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>SKSS Daily ${esc(heading)} ${esc(month || todayKey())}</title>
<style>
  body{font-family:"Hiragino Sans","Yu Gothic",-apple-system,sans-serif;color:#2c372e;
    padding:28px 24px;max-width:720px;margin:0 auto;line-height:1.6;}
  h1{font-size:20px;margin-bottom:4px;}
  .meta{color:#666;font-size:12px;margin-bottom:22px;}
  .entry{border-bottom:1px solid #ddd;padding:16px 0;break-inside:avoid;}
  .entry:last-child{border-bottom:none;}
  .entry h2{font-size:15px;margin-bottom:8px;}
  .cat{margin-bottom:6px;}
  .cat h3{font-size:12.5px;color:#3f6a44;margin-bottom:2px;font-weight:700;}
  .cat ul{margin:0 0 0 20px;padding:0;font-size:13px;}
  .cat .empty{margin:0 0 0 2px;font-size:12.5px;color:#999;}
  .checks{font-size:12.5px;color:#555;margin:10px 0 4px;}
  .goal{font-size:13px;}
  .pv-thumb{width:22px;height:22px;object-fit:cover;border-radius:6px;vertical-align:middle;margin-left:4px;}
  @media print{ body{padding:0;} }
</style></head>
<body>
  <h1>🌱🌳🌿🌸 SKSS Daily ${esc(heading)}</h1>
  <p class="meta">書き出し日時：${esc(new Date().toLocaleString("ja-JP"))} ／ 記録件数：${entries.length}件</p>
  ${entries.length ? rows : "<p>まだ記録がありません。</p>"}
</body></html>`;
}

function handlePrintExport(month){
  const win = window.open("", "_blank");
  if (!win) {
    showToast("ポップアップがブロックされました");
    return;
  }
  let html;
  try {
    html = buildPrintableHtml(month);
  } catch (e) {
    console.error("SKSS Daily: failed to build printable page", e);
    win.close();
    showToast("⚠ 印刷用ページの作成に失敗しました");
    return;
  }
  win.document.open();
  win.document.write(html);
  win.document.close();
  win.focus();
  setTimeout(() => win.print(), 300);
}

function showToast(msg){
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toast.classList.remove("show"), 1800);
}

/* ---------- event delegation ---------- */
const app = document.getElementById("app");

app.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;

  if (action === "add-item") {
    handleAddItem(el.dataset.scope, el.dataset.date, el.dataset.cat, el.dataset.input);
  } else if (action === "remove-item") {
    handleRemoveItem(el.dataset.date, el.dataset.cat, Number(el.dataset.index));
  } else if (action === "save") {
    persistEntry(todayKey());
    if (Sync.connected()) Sync.save(); else showToast("✓ 保存しました");
  } else if (action === "save-log") {
    persistEntry(el.dataset.date);
    state.expandedDate = null;
    if (!Sync.connected()) showToast("✓ 保存しました");
    render();
    if (Sync.connected()) Sync.save();
  } else if (action === "connect-github") {
    handleConnectGithub();
  } else if (action === "disconnect-github") {
    handleDisconnectGithub();
  } else if (action === "pull-github") {
    Sync.load();
  } else if (action === "open-logs") {
    state.view = "logs";
    state.expandedDate = null;
    render();
  } else if (action === "back-today") {
    state.view = "today";
    render();
  } else if (action === "toggle-log") {
    const date = el.dataset.date;
    state.expandedDate = state.expandedDate === date ? null : date;
    render();
  } else if (action === "toggle-month") {
    const month = el.dataset.month;
    state.expandedMonth = state.expandedMonth === month ? null : month;
    render();
  } else if (action === "export-backup") {
    handleExportBackup();
  } else if (action === "export-print") {
    handlePrintExport();
  } else if (action === "copy-chat") {
    handleCopyChat();
  } else if (action === "month-print") {
    handlePrintExport(state.selectedMonth);
  } else if (action === "month-json") {
    handleExportBackup(state.selectedMonth);
  } else if (action === "month-chat") {
    handleCopyChat(state.selectedMonth);
  } else if (action === "import-backup") {
    document.getElementById("import-backup-file")?.click();
  } else if (action === "trigger-image") {
    document.getElementById(el.dataset.target)?.click();
  } else if (action === "clear-pending-image") {
    pendingImages.delete(el.dataset.input);
    renderPendingPreview(el.dataset.input);
  } else if (action === "view-image") {
    openLightbox(el.src);
  }
});

document.getElementById("lightbox").addEventListener("click", closeLightbox);

app.addEventListener("change", (e) => {
  if (e.target.id === "import-backup-file") {
    handleImportBackup(e.target.files?.[0]);
    e.target.value = "";
    return;
  }
  if (e.target.id === "month-select") {
    state.selectedMonth = e.target.value;
    return;
  }
  const checkEl = e.target.closest('[data-action="toggle-check"]');
  if (checkEl) { handleToggleCheck(checkEl.dataset.date, checkEl.dataset.field, checkEl.checked); return; }

  const fileEl = e.target.closest('[data-action="pick-image"]');
  if (fileEl) handlePickImage(fileEl);
});

app.addEventListener("input", (e) => {
  const goalEl = e.target.closest('[data-action="edit-goal"]');
  if (goalEl) { handleEditGoal(goalEl.dataset.date, goalEl.value); return; }

  const memoEl = e.target.closest('[data-action="edit-memo"]');
  if (memoEl) handleEditMemo(memoEl.dataset.date, memoEl.value);
});

// IME (日本語入力) の変換確定Enterで誤って追加されないよう、変換中は無視する。
// 以前はcompositionstart/endで自前のフラグも立てていたが、スマホでは入力中に
// フォーカスが外れるなどでcompositionendが来ないことがあり、フラグが true の
// まま固まって二度とEnterで追加できなくなる不具合があった。isComposing は
// イベントごとに毎回読み直される値で固着しないため、これだけに頼る。
app.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  if (e.isComposing || e.keyCode === 229) return;
  const el = e.target.closest('[data-action="add-input"]');
  if (!el) return;
  e.preventDefault();
  handleAddItem(el.dataset.scope, el.dataset.date, el.dataset.cat, el.id);
});

/* ---------- init ---------- */
render();
Sync.load();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((e) => console.error("SW registration failed", e));
  });
}
</script>
