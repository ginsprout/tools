<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idea Catcher — Ginsprout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Noto+Serif+JP:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --ink:       #1a1a2e;
    --paper:     #e8e0d0;
    --paper-dim: #d4cabb;
    --teal:      #5f8a8b;
    --teal-dim:  #3d6364;
    --gold:      #c9a84c;
    --ghost:     #8a8070;
    --surface:   #f2ece0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--ink);
    color: var(--paper);
    font-family: 'Noto Serif JP', serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px 80px;
  }

  /* ── ヘッダー ── */
  header {
    width: 100%;
    max-width: 680px;
    padding: 36px 0 8px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .brand {
    font-family: 'DM Serif Display', serif;
    font-size: 1.1rem;
    color: var(--gold);
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .brand-sub {
    font-size: .72rem;
    color: var(--ghost);
    letter-spacing: .2em;
    text-transform: uppercase;
  }

  /* ── AIカード ── */
  #ai-card {
    width: 100%;
    max-width: 680px;
    margin-top: 28px;
    background: var(--surface);
    color: var(--ink);
    border-radius: 4px;
    padding: 32px 32px 28px;
    position: relative;
    box-shadow: 0 8px 40px rgba(0,0,0,.45);
    transform: translateY(6px);
    opacity: 0;
    transition: opacity .6s ease, transform .6s ease;
  }
  #ai-card.visible { opacity: 1; transform: translateY(0); }

  .card-eyebrow {
    font-size: .62rem;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--teal-dim);
    margin-bottom: 18px;
  }
  .card-idea-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.45rem;
    line-height: 1.4;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .card-idea-memo {
    font-size: .85rem;
    color: #5a5248;
    line-height: 1.7;
    margin-bottom: 20px;
    white-space: pre-wrap;
  }
  .card-divider {
    border: none;
    border-top: 1px solid var(--paper-dim);
    margin: 0 0 18px;
  }
  .ai-label {
    font-size: .6rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 8px;
  }
  #ai-comment {
    font-size: .9rem;
    line-height: 1.8;
    color: #3d3830;
    min-height: 1.8em;
  }
  .cursor {
    display: inline-block;
    width: 1px;
    height: 1em;
    background: var(--teal);
    margin-left: 1px;
    vertical-align: text-bottom;
    animation: blink .9s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .card-meta {
    margin-top: 16px;
    font-size: .68rem;
    color: var(--ghost);
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: center;
  }
  .card-tag {
    background: var(--paper-dim);
    padding: 2px 8px;
    border-radius: 2px;
    font-size: .65rem;
    color: #5a5248;
  }

  .card-actions {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }
  .btn-ghost {
    background: none;
    border: 1px solid var(--paper-dim);
    color: #5a5248;
    padding: 7px 16px;
    border-radius: 2px;
    font-size: .75rem;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    letter-spacing: .05em;
    transition: border-color .2s, color .2s;
  }
  .btn-ghost:hover { border-color: var(--teal); color: var(--teal-dim); }

  #no-ideas-msg {
    width: 100%;
    max-width: 680px;
    margin-top: 28px;
    padding: 24px;
    border: 1px dashed #3a3550;
    border-radius: 4px;
    font-size: .85rem;
    color: var(--ghost);
    text-align: center;
    line-height: 1.8;
    display: none;
  }

  /* ── 入力フォーム ── */
  .input-section {
    width: 100%;
    max-width: 680px;
    margin-top: 32px;
  }
  .section-label {
    font-size: .62rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ghost);
    margin-bottom: 12px;
  }
  .input-title {
    width: 100%;
    background: #242040;
    border: 1px solid #3a3550;
    border-radius: 3px 3px 0 0;
    padding: 14px 16px;
    color: var(--paper);
    font-family: 'DM Serif Display', serif;
    font-size: 1.1rem;
    outline: none;
    transition: border-color .2s;
  }
  .input-title::placeholder { color: #4a4560; }
  .input-title:focus { border-color: var(--teal); }

  .input-memo {
    width: 100%;
    background: #1e1b38;
    border: 1px solid #3a3550;
    border-top: none;
    border-radius: 0;
    padding: 12px 16px;
    color: #c8c0b0;
    font-family: 'Noto Serif JP', serif;
    font-size: .85rem;
    font-weight: 300;
    outline: none;
    resize: vertical;
    min-height: 80px;
    line-height: 1.75;
    transition: border-color .2s;
  }
  .input-memo::placeholder { color: #3d3a5a; }
  .input-memo:focus { border-color: var(--teal); }

  .input-tag {
    width: 100%;
    background: #1e1b38;
    border: 1px solid #3a3550;
    border-top: none;
    border-radius: 0 0 3px 3px;
    padding: 10px 16px;
    color: #8a8070;
    font-family: 'DM Mono', monospace;
    font-size: .78rem;
    outline: none;
    transition: border-color .2s;
  }
  .input-tag::placeholder { color: #3d3a5a; }
  .input-tag:focus { border-color: var(--teal); }

  .btn-save {
    margin-top: 12px;
    width: 100%;
    background: var(--teal);
    border: none;
    color: #f0ece4;
    padding: 14px;
    font-family: 'DM Mono', monospace;
    font-size: .78rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: background .2s;
  }
  .btn-save:hover { background: var(--teal-dim); }

  /* ── アーカイブ ── */
  .archive-section {
    width: 100%;
    max-width: 680px;
    margin-top: 44px;
  }
  .archive-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }
  .archive-toggle {
    background: none;
    border: none;
    color: var(--ghost);
    font-size: .72rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0;
    font-family: 'DM Mono', monospace;
    transition: color .2s;
  }
  .archive-toggle:hover { color: var(--paper-dim); }
  .toggle-arrow { transition: transform .3s; display: inline-block; }
  .toggle-arrow.open { transform: rotate(90deg); }

  .backup-actions {
    display: flex;
    gap: 8px;
  }
  .btn-backup {
    background: none;
    border: 1px solid #3a3550;
    color: var(--ghost);
    padding: 5px 12px;
    border-radius: 2px;
    font-size: .68rem;
    cursor: pointer;
    font-family: 'DM Mono', monospace;
    letter-spacing: .05em;
    transition: border-color .2s, color .2s;
  }
  .btn-backup:hover { border-color: var(--teal); color: var(--teal-dim); }

  #archive-list {
    margin-top: 16px;
    display: none;
    flex-direction: column;
    gap: 10px;
  }
  #archive-list.open { display: flex; }

  .archive-item {
    background: #1e1b38;
    border: 1px solid #3a3550;
    border-radius: 3px;
    padding: 16px 18px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 6px 12px;
    align-items: start;
  }
  .archive-title {
    font-family: 'DM Serif Display', serif;
    font-size: .95rem;
    color: var(--paper);
    line-height: 1.4;
  }
  .archive-memo {
    grid-column: 1;
    font-size: .78rem;
    color: #7a7262;
    line-height: 1.65;
    white-space: pre-wrap;
    margin-top: 4px;
  }
  .archive-meta {
    font-size: .65rem;
    color: #4a4560;
    font-family: 'DM Mono', monospace;
    white-space: nowrap;
  }
  .archive-tags {
    grid-column: 1;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .archive-tag {
    font-size: .6rem;
    color: #5a6a6b;
    border: 1px solid #3a4a4b;
    padding: 1px 7px;
    border-radius: 2px;
    font-family: 'DM Mono', monospace;
  }
  .archive-btns {
    grid-row: 1 / span 4;
    grid-column: 2;
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-end;
  }
  .archive-title { grid-column: 1; }
  .btn-del, .btn-edit, .btn-comment {
    background: none;
    border: none;
    cursor: pointer;
    font-size: .75rem;
    padding: 4px 0;
    min-height: 28px;
    line-height: 1;
    transition: color .2s, border-color .2s;
    font-family: 'DM Mono', monospace;
    white-space: nowrap;
  }
  .btn-comment { color: #5f7f80; }
  .btn-comment:hover { color: var(--gold); }
  .btn-del  { color: #3a3550; }
  .btn-del:hover  { color: #8a6060; }
  .btn-edit { color: #3a4a5a; }
  .btn-edit:hover { color: var(--teal); }

  /* ── 編集モーダル ── */
  #edit-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10,10,20,.75);
    z-index: 900;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #edit-modal.show { display: flex; }
  .modal-box {
    background: #1e1b38;
    border: 1px solid #3a3550;
    border-radius: 6px;
    padding: 28px 24px;
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .modal-label {
    font-size: .62rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ghost);
    margin-bottom: 2px;
  }
  .modal-title-input {
    width: 100%;
    background: #242040;
    border: 1px solid #3a3550;
    border-radius: 3px;
    padding: 12px 14px;
    color: var(--paper);
    font-family: 'DM Serif Display', serif;
    font-size: 1.05rem;
    outline: none;
  }
  .modal-title-input:focus { border-color: var(--teal); }
  .modal-memo-input {
    width: 100%;
    background: #1a1835;
    border: 1px solid #3a3550;
    border-radius: 3px;
    padding: 10px 14px;
    color: #c8c0b0;
    font-family: 'Noto Serif JP', serif;
    font-size: .85rem;
    font-weight: 300;
    outline: none;
    resize: vertical;
    min-height: 80px;
    line-height: 1.75;
  }
  .modal-memo-input:focus { border-color: var(--teal); }
  .modal-tag-input {
    width: 100%;
    background: #1a1835;
    border: 1px solid #3a3550;
    border-radius: 3px;
    padding: 8px 14px;
    color: #8a8070;
    font-family: 'DM Mono', monospace;
    font-size: .78rem;
    outline: none;
  }
  .modal-tag-input:focus { border-color: var(--teal); }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 6px;
  }
  .btn-modal-save {
    flex: 1;
    background: var(--teal);
    border: none;
    color: #f0ece4;
    padding: 12px;
    font-family: 'DM Mono', monospace;
    font-size: .75rem;
    letter-spacing: .1em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: background .2s;
  }
  .btn-modal-save:hover { background: var(--teal-dim); }
  .btn-modal-cancel {
    background: none;
    border: 1px solid #3a3550;
    color: var(--ghost);
    padding: 12px 20px;
    font-family: 'DM Mono', monospace;
    font-size: .75rem;
    cursor: pointer;
    border-radius: 2px;
    transition: border-color .2s, color .2s;
  }
  .btn-modal-cancel:hover { border-color: var(--ghost); color: var(--paper-dim); }

  /* ── GitHub同期 ── */
  #sync-status {
    position: sticky;
    top: 8px;
    z-index: 50;
    width: 100%;
    max-width: 680px;
    margin-top: 12px;
    padding: 10px 14px;
    border: 1px solid #3a3550;
    border-radius: 3px;
    background: #22223a;
    color: var(--paper-dim);
    font-size: .8rem;
    line-height: 1.6;
  }
  #sync-status:empty { display: none; }
  #sync-status.ok    { border-color: var(--teal); color: #a9cfcf; }
  #sync-status.error { border-color: #c4705a; background: #3a2226; color: #f0b8a8; }

  .sync-section {
    width: 100%;
    max-width: 680px;
    margin-top: 44px;
    padding: 18px;
    border: 1px solid #3a3550;
    border-radius: 3px;
  }
  .sync-note {
    font-size: .8rem;
    line-height: 1.8;
    color: var(--ghost);
    margin-bottom: 14px;
  }
  .sync-input {
    width: 100%;
    min-height: 48px;
    background: transparent;
    border: 1px solid #3a3550;
    border-radius: 2px;
    padding: 10px 14px;
    color: var(--paper);
    font-family: 'DM Mono', monospace;
    font-size: 16px;
    outline: none;
    margin-bottom: 10px;
  }
  .sync-input:focus { border-color: var(--teal); }
  .sync-actions { display: flex; gap: 10px; }
  .btn-sync {
    flex: 1;
    min-height: 48px;
    background: none;
    border: 1px solid var(--teal);
    color: #a9cfcf;
    border-radius: 2px;
    font-family: 'Noto Serif JP', serif;
    font-size: .85rem;
    cursor: pointer;
  }
  .btn-sync.primary { background: var(--teal); color: #f0ece4; }
  .btn-sync.danger  { border-color: #c4705a; color: #f0b8a8; }

  /* ── トースト ── */
  #toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--teal);
    color: #f0ece4;
    padding: 10px 24px;
    border-radius: 3px;
    font-size: .78rem;
    font-family: 'DM Mono', monospace;
    letter-spacing: .08em;
    opacity: 0;
    transition: opacity .3s, transform .3s;
    pointer-events: none;
    z-index: 999;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── スピナー ── */
  .spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid var(--paper-dim);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── コメントの切り口 ── */
  #ai-card { scroll-margin-top: 72px; }
  .card-actions { flex-wrap: wrap; }
  .angle-section { margin-top: 20px; }
  .angle-label {
    font-size: .6rem;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ghost);
    margin-bottom: 8px;
  }
  .angle-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .angle-chip {
    background: none;
    border: 1px solid var(--paper-dim);
    color: #5a5248;
    padding: 6px 14px;
    min-height: 36px;
    border-radius: 18px;
    font-family: 'Noto Serif JP', serif;
    font-size: .75rem;
    cursor: pointer;
    transition: border-color .2s, color .2s, background .2s;
  }
  .angle-chip:hover { border-color: var(--teal); color: var(--teal-dim); }
  .angle-chip.active { background: var(--teal); border-color: var(--teal); color: #f0ece4; }

  /* ── タグの絞り込み ── */
  .filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .filter-bar:empty { display: none; }
  .filter-chip, .modal-genre {
    background: none;
    border: 1px solid #3a3550;
    color: var(--ghost);
    padding: 6px 14px;
    min-height: 36px;
    border-radius: 18px;
    font-family: 'Noto Serif JP', serif;
    font-size: .75rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: border-color .2s, color .2s, background .2s;
  }
  .filter-chip .count { font-family: 'DM Mono', monospace; font-size: .68rem; color: #5a5470; }
  .filter-chip:hover, .modal-genre:hover { border-color: var(--teal); color: var(--paper-dim); }
  .filter-chip.active, .modal-genre.active { background: var(--teal); border-color: var(--teal); color: #f0ece4; }
  .filter-chip.active .count { color: #d8ecec; }

  .bulk-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
  .bulk-row:empty { display: none; }
  .bulk-progress { font-size: .75rem; color: var(--ghost); line-height: 1.6; }
  .btn-backup:disabled { opacity: .5; cursor: default; }

  .archive-empty {
    padding: 18px;
    border: 1px dashed #3a3550;
    border-radius: 3px;
    font-size: .8rem;
    color: var(--ghost);
    text-align: center;
  }

  .modal-genres { display: flex; flex-wrap: wrap; gap: 6px; }

  /* ── スマホ：指で押しやすく ── */
  @media (max-width: 600px) {
    #ai-card { padding: 24px 20px 22px; }
    .btn-ghost, .btn-backup, .filter-chip, .angle-chip, .modal-genre { min-height: 44px; }
    .btn-ghost { flex: 1 1 auto; }
    .backup-actions { flex-wrap: wrap; }
    .archive-item { grid-template-columns: 1fr; }
    .archive-btns {
      grid-column: 1;
      grid-row: auto;
      flex-direction: row;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .btn-del, .btn-edit, .btn-comment {
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid #3a3550;
      border-radius: 2px;
    }
    .btn-edit { color: #7a8a9a; }
    .btn-del  { color: #8a7070; }
  }
</style>
</head>
<body>

<header>
  <span class="brand">Ginsprout</span>
  <span class="brand-sub">Idea Catcher</span>
</header>

<div id="sync-status" role="status" aria-live="polite"></div>

<!-- AIピックアップカード -->
<div id="ai-card" style="display:none">
  <div class="card-eyebrow" id="card-eyebrow">Today's pickup — AI selected</div>
  <div class="card-idea-title" id="card-title"></div>
  <div class="card-idea-memo" id="card-memo"></div>
  <hr class="card-divider">
  <div class="ai-label" id="ai-label">AI comment</div>
  <div id="ai-comment"></div>
  <div class="card-meta">
    <span id="card-date"></span>
    <span id="card-tags"></span>
  </div>
  <div class="angle-section">
    <div class="angle-label">コメントの切り口</div>
    <div class="angle-chips" id="angle-chips" role="group" aria-label="コメントの切り口"></div>
  </div>
  <div class="card-actions">
    <button class="btn-ghost" onclick="pickRandom()">▶ 別のアイデアを見る</button>
    <button class="btn-ghost" onclick="regenComment()">↺ コメントを更新</button>
  </div>
</div>

<div id="no-ideas-msg">
  まだアイデアがありません。<br>最初のひとつを書いてみましょう。
</div>

<!-- 入力フォーム -->
<div class="input-section">
  <div class="section-label">New Idea</div>
  <input id="inp-title" class="input-title" type="text" placeholder="アイデアのタイトル">
  <textarea id="inp-memo" class="input-memo" placeholder="メモ（任意）"></textarea>
  <input id="inp-tag" class="input-tag" type="text" placeholder="タグ：スペース区切り（任意）※保存するとAIがジャンルも自動でつけます">
  <button class="btn-save" onclick="saveIdea()">✦ 保存する</button>
</div>

<!-- アーカイブ -->
<div class="archive-section">
  <div class="archive-header">
    <button class="archive-toggle" onclick="toggleArchive()">
      <span class="toggle-arrow" id="toggle-arrow">▶</span>
      <span id="archive-count-label">すべてのアイデア</span>
    </button>
    <div class="backup-actions">
      <button class="btn-backup" onclick="exportIdeas()">⇩ バックアップ</button>
      <button class="btn-backup" onclick="document.getElementById('import-file').click()">⇧ 復元</button>

<!-- GitHub同期（中身はrenderSyncSectionで描画） -->
<div class="sync-section" id="sync-section"></div>

<!-- 編集モーダル -->
<div id="edit-modal">
  <div class="modal-box">

    <input id="edit-title" class="modal-title-input" type="text" placeholder="タイトル">

      <button class="btn-modal-save" onclick="saveEdit()">✦ 保存する</button>
      <button class="btn-modal-cancel" onclick="closeModal()">キャンセル</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const STORAGE_KEY = 'ginsprout_ideas_v1';

/* ── 設定：ジャンル候補 ──
   AIの自動タグ付けは、ここにある言葉だけを使います。増やす・減らす・名前を変えるときはここだけ直せばOK。
   タグはスペース区切りで入力するので、名前にスペースは入れないでください。 */
const GENRES = ['小説', 'ツール', 'デザイン', '発達支援', '絵本', 'note・エッセイ', '仕事・ビジネス', 'その他'];

/* ── 設定：AIプロキシ ── */
const AI_PROXY_URL = 'https://ginsprout-proxy.yumco-taka.workers.dev/';
const AI_MODEL     = 'claude-sonnet-4-6';

function loadIdeas() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { return []; }
}
function writeIdeas(ideas) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(ideas));
}
// 端末に保存して、GitHub連携中ならGitHubにも送る
function saveIdeas(ideas) {
  writeIdeas(ideas);
  Sync.save();
}

// 削除したアイデアの { id, deletedAt }。同期で別端末の古いコピーから復活しないよう覚えておく
const DELETED_KEY = 'ginsprout_ideas_deleted_v1';
function loadDeleted() {
  try { return JSON.parse(localStorage.getItem(DELETED_KEY)) || []; }
  catch { return []; }
}
function writeDeleted(list) {
  localStorage.setItem(DELETED_KEY, JSON.stringify(list));
}
// 同じidは新しい削除時刻だけ残す
function mergeDeleted(a, b) {
  const byId = new Map();
  for (const d of [...a, ...b]) {
    if (d && d.id && (!byId.has(d.id) || d.deletedAt > byId.get(d.id).deletedAt)) byId.set(d.id, d);
  }
  return [...byId.values()];
}

/* ── GitHub同期 ──
   トークンはこのブラウザのlocalStorageだけに保存（コードやリポジトリには書かない）。
   SKSS Dailyと同じサイト・同じ非公開リポジトリなので、トークンも共有する。 */
const GITHUB_URL = 'https://api.github.com/repos/ginsprout/skss-daily-data/contents/ideas.json';
const TOKEN_KEY  = 'skssDaily.githubToken';

class SyncError extends Error {
  constructor(message, status) { super(message); this.status = status; }
}

function base64ToUtf8(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}
function utf8ToBase64(text) {
  const bytes = new TextEncoder().encode(text);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

// 同じidは「最後に直した時間」が新しい方を残す。削除のあとに直した（復元した）もの以外は消す
function mergeIdeas(local, remote, deleted) {
  const deletedAt = new Map(deleted.map(d => [d.id, d.deletedAt]));
  const byId = new Map();
  const version = i => i.updatedAt || i.createdAt || '';
  for (const idea of [...local, ...remote]) {
    if (!idea || !idea.id) continue;
    if (deletedAt.has(idea.id) && deletedAt.get(idea.id) >= version(idea)) continue;
    const mine = byId.get(idea.id);
    if (!mine || version(idea) > version(mine)) byId.set(idea.id, idea);
  }
  return [...byId.values()].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
}

function clockNow() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

const Sync = {
  _busy: false,
  _again: false,

  getToken() {
    try { return localStorage.getItem(TOKEN_KEY) || ''; } catch { return ''; }
  },
  setToken(token) {
    try { localStorage.setItem(TOKEN_KEY, token); } catch { /* 保存できない環境では未接続のまま */ }
  },
  clearToken() {
    try { localStorage.removeItem(TOKEN_KEY); } catch { /* 消すものがない */ }
  },
  connected() { return !!this.getToken(); },

  setStatus(kind, text) {
    const el = document.getElementById('sync-status');
    el.className = kind;
    el.textContent = text;
  },

  async _fetch(method, { accept = 'application/vnd.github+json', body } = {}) {
    let res;
    try {
      res = await fetch(GITHUB_URL, {
        method,
        cache: 'no-store',
        headers: {
          Authorization: `Bearer ${this.getToken()}`,
          Accept: accept,
          'X-GitHub-Api-Version': '2022-11-28',
          ...(body ? { 'Content-Type': 'application/json' } : {}),
        },
        body: body ? JSON.stringify(body) : undefined,
      });
    } catch {
      throw new SyncError('ネットにつながっていないようです', 0);
    }
    if (res.status === 401) throw new SyncError('トークンが正しくないか、期限切れです', 401);
    if (res.status === 403 || res.status === 404) throw new SyncError('データ用リポジトリに入れません。トークンの権限を確認してください', res.status);
    if (res.status === 409 || res.status === 422) throw new SyncError('ほかの端末と同時に保存されました', 409);
    if (!res.ok) throw new SyncError(`GitHubがエラーを返しました（${res.status}）`, res.status);
    return res;
  },

  // GitHub上の最新のideas.jsonを { sha, ideas, deleted } で返す
  async _pull() {
    const meta = await (await this._fetch('GET')).json();
    // 1MBを超えるとcontentが空になるので、そのときは中身だけ取り直す
    const text = meta.content
      ? base64ToUtf8(meta.content)
      : await (await this._fetch('GET', { accept: 'application/vnd.github.raw+json' })).text();
    const data = text.trim() ? JSON.parse(text) : {};
    return {
      sha: meta.sha,
      ideas: Array.isArray(data.ideas) ? data.ideas : [],
      deleted: Array.isArray(data.deleted) ? data.deleted : [],
    };
  },

  // GitHubの内容をこの端末にまとめる。変わったものがあればtrue
  _applyRemote(remote) {
    const deleted = mergeDeleted(loadDeleted(), remote.deleted);
    const local  = loadIdeas();
    const merged = mergeIdeas(local, remote.ideas, deleted);
    writeDeleted(deleted);
    const changed = JSON.stringify(merged) !== JSON.stringify(local);
    if (changed) writeIdeas(merged);
    return changed;
  },

  _refreshView() {
    renderAll();
    // 最初は空だった端末に、GitHubからアイデアが届いたとき
    if (loadIdeas().length && document.getElementById('ai-card').style.display === 'none') pickRandom();
  },

  async load() {
    if (!this.connected()) return false;
    this.setStatus('busy', '☁ GitHubから読み込み中…');
    try {
      if (this._applyRemote(await this._pull())) this._refreshView();
      this.setStatus('ok', `✓ GitHubから最新を読み込みました（${clockNow()}）`);
      return true;
    } catch (e) {
      console.error('Idea Catcher: GitHub load failed', e);
      this.setStatus('error', `⚠ GitHubから読み込めませんでした：${e instanceof SyncError ? e.message : 'データの形式が正しくありません'}`);
      return false;
    }
  },

  async save() {
    if (!this.connected()) return;
    if (this._busy) { this._again = true; return; } // 保存中の操作は、終わったあとにもう1回まとめて送る
    this._busy = true;
    this.setStatus('busy', '☁ GitHubに保存中…');
    try {
      for (let attempt = 0; ; attempt++) {
        try {
          // 先に読み込んで、ほかの端末で足したアイデアを消さないようにする
          const remote = await this._pull();
          if (this._applyRemote(remote)) this._refreshView();
          const content = JSON.stringify({
            app: 'idea-catcher',
            schemaVersion: 1,
            ideas: loadIdeas(),
            deleted: loadDeleted(),
          }, null, 2);
          await this._fetch('PUT', { body: {
            message: `Update Idea Catcher (${new Date().toISOString().slice(0, 10)})`,
            content: utf8ToBase64(content + '\n'),
            sha: remote.sha,
          } });
          break;
        } catch (e) {
          if (e instanceof SyncError && e.status === 409 && attempt < 2) continue;
          throw e;
        }
      }
      this.setStatus('ok', `✓ GitHubに保存しました（${clockNow()}）`);
    } catch (e) {
      console.error('Idea Catcher: GitHub save failed', e);
      this.setStatus('error', `⚠ GitHubに保存できませんでした：${e instanceof SyncError ? e.message : 'データの形式が正しくありません'}。この端末には保存済みです`);
    } finally {
      this._busy = false;
      if (this._again) { this._again = false; this.save(); }
    }
  },
};

function renderSyncSection() {
  const el = document.getElementById('sync-section');
  if (!Sync.connected()) {
    el.innerHTML = `
      <div class="section-label">GitHub Sync</div>
      <p class="sync-note">☁ GitHub連携（未設定）<br>SKSS日報で使っているトークンを貼ると、Macとスマホで同じアイデアを見られます。トークンはこの端末の中だけに保存されます。</p>
      <input id="github-token-input" class="sync-input" type="password" placeholder="github_pat_… を貼り付け"
        autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="GitHubのトークン">
      <div class="sync-actions">
        <button class="btn-sync primary" onclick="connectGithub()">接続する</button>
      </div>`;
    return;
  }
  el.innerHTML = `
    <div class="section-label">GitHub Sync</div>
    <p class="sync-note">☁ GitHub連携中<br>開いたときに読み込み、アイデアを追加・編集・削除するたびにGitHubへ保存します。</p>
    <div class="sync-actions">
      <button class="btn-sync" onclick="Sync.load()">↻ 今すぐ読み込む</button>
      <button class="btn-sync danger" onclick="disconnectGithub()">トークンを消す</button>
    </div>`;
}

async function connectGithub() {
  const input = document.getElementById('github-token-input');
  const token = input ? input.value.trim() : '';
  if (!token) { input?.focus(); return; }
  Sync.setToken(token);
  if (await Sync.load()) {
    renderSyncSection();
    Sync.save(); // この端末にしかなかったアイデアもGitHubへ送る
  } else {
    // リポジトリに入れないトークンは残さない
    Sync.clearToken();
    renderSyncSection();
  }
}

function disconnectGithub() {
  if (!confirm('この端末からトークンを消します。SKSS日報の連携も一緒に外れます（どちらのデータも消えません）。続けますか？')) return;
  Sync.clearToken();
  Sync.setStatus('', '');
  renderSyncSection();
}

function formatDate(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

/* ── タグの小道具 ── */
const UNTAGGED = '__untagged__'; // 絞り込み「未分類」の目印
function tagsOf(idea) { return Array.isArray(idea.tags) ? idea.tags : []; }
function parseTagInput(raw) { return raw.trim() ? raw.trim().split(/\s+/).filter(Boolean) : []; }
function tagLabel(tag) { return tag === UNTAGGED ? '未分類' : tag; }
function filterIdeas(ideas, tag) {
  if (!tag) return ideas;
  if (tag === UNTAGGED) return ideas.filter(i => !tagsOf(i).length);
  return ideas.filter(i => tagsOf(i).includes(tag));
}

/* ── AIを呼ぶ（コメントもタグ付けも同じプロキシ） ── */
async function callAI(prompt, maxTokens = 1000) {
  const res = await fetch(AI_PROXY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: AI_MODEL,
      max_tokens: maxTokens,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if (!res.ok) throw new Error(`AI proxy returned ${res.status}`);
  const data = await res.json();
  return data.content?.find(b => b.type === 'text')?.text || '';
}

/* ── AIによる自動タグ付け ── */
// AIの返事から、候補（GENRES）にある言葉だけを最大3つ拾う
function parseGenres(text) {
  let items = [];
  const m = text.match(/\[[\s\S]*?\]/);
  if (m) {
    try { const arr = JSON.parse(m[0]); if (Array.isArray(arr)) items = arr.map(String); } catch { /* 下で文字列として読む */ }
  }
  if (!items.length) items = text.split(/[,，、\n"'「」\[\]]/);
  const out = [];
  for (const raw of items) {
    const t = raw.trim();
    if (GENRES.includes(t) && !out.includes(t)) out.push(t);
  }
  return out.slice(0, 3);
}

// 合うジャンルを返す。オフラインやエラーのときは [] （保存は止めない）
async function suggestGenres(idea) {
  const prompt = `次のアイデアに合うジャンルを、下の候補の中から1〜3個選んでください。

候補：${GENRES.join(' / ')}

アイデアタイトル：${idea.title}
メモ：${idea.memo || '（なし）'}

返答は候補の名前だけを JSON 配列で。候補にない言葉は使わないこと。例：["${GENRES[1]}","${GENRES[2]}"]`;
  try {
    return parseGenres(await callAI(prompt, 100));
  } catch (e) {
    console.warn('Idea Catcher: auto-tag failed', e);
    return [];
  }
}

// ジャンルをタグに足す（自分で書いたタグはそのまま残す）。変わったら true
function applyGenres(id, genres) {
  let changed = false;
  const ideas = loadIdeas().map(i => {
    if (i.id !== id) return i;
    const cur = tagsOf(i);
    const add = genres.filter(g => !cur.includes(g));
    if (!add.length) return i;
    changed = true;
    return { ...i, tags: [...cur, ...add], updatedAt: new Date().toISOString() };
  });
  if (changed) { saveIdeas(ideas); renderAll(); }
  return changed;
}

async function autoTag(idea) {
  const genres = await suggestGenres(idea);
  if (genres.length && applyGenres(idea.id, genres)) showToast(`ジャンル：${genres.join('・')}`);
}

/* ── タグなしのアイデアにまとめてタグ付け ── */
let bulkRunning = false;
let bulkProgress = '';
let bulkClearTimer = null;

async function bulkTag() {
  if (bulkRunning) return;
  const targets = loadIdeas().filter(i => !tagsOf(i).length).map(i => i.id);
  if (!targets.length) return;
  bulkRunning = true;
  clearTimeout(bulkClearTimer);
  let tagged = 0;
  for (let n = 0; n < targets.length; n++) {
    bulkProgress = `${n + 1} / ${targets.length} 件目を判定中…`;
    renderArchive();
    const idea = loadIdeas().find(i => i.id === targets[n]);
    if (!idea || tagsOf(idea).length) continue; // 途中で消された・手でタグがついたものは飛ばす
    const genres = await suggestGenres(idea);
    if (genres.length && applyGenres(idea.id, genres)) tagged++;
  }
  bulkRunning = false;
  const failed = targets.length - tagged;
  bulkProgress = `✓ ${tagged}件にタグを付けました${failed ? `（${failed}件はタグを付けられませんでした）` : ''}`;
  renderAll();
  showToast(tagged ? `${tagged}件にタグを付けました` : 'タグを付けられませんでした（オフライン？）');
  bulkClearTimer = setTimeout(() => { bulkProgress = ''; renderArchive(); }, 8000);
}

/* ── 保存 ── */
function saveIdea() {
  const title = document.getElementById('inp-title').value.trim();
  if (!title) { showToast('タイトルを入力してください'); return; }
  const memo  = document.getElementById('inp-memo').value.trim();
  const tags  = parseTagInput(document.getElementById('inp-tag').value);

  // 先に保存してから、AIのジャンル判定をあとから足す（AIが遅くても・失敗しても保存は終わっている）
  const idea  = { id: Date.now(), title, memo, tags, createdAt: new Date().toISOString() };
  const ideas = loadIdeas();
  ideas.unshift(idea);
  saveIdeas(ideas);

  document.getElementById('inp-title').value = '';
  document.getElementById('inp-memo').value  = '';
  document.getElementById('inp-tag').value   = '';

  showToast('保存しました（AIがジャンルを判定中…）');
  renderAll();
  autoTag(idea);
}

/* ── ランダムピック + AIコメント ── */
let currentPickId = null;

async function pickRandom(ideaOverride) {
  const ideas = loadIdeas();
  if (!ideas.length) {
    document.getElementById('ai-card').style.display = 'none';
    document.getElementById('no-ideas-msg').style.display = 'block';
    return;
  }

  let idea;
  let eyebrow = "Today's pickup — AI selected";
  if (ideaOverride) {
    idea = ideaOverride;
    eyebrow = 'Your pick — 選んだアイデア';
  } else {
    // 一覧で絞り込み中なら、そのタグの中から選ぶ（0件なら全体から）
    const filtered = filterIdeas(ideas, activeTag);
    const base = filtered.length ? filtered : ideas;
    if (activeTag && filtered.length) eyebrow = `Pickup — ${tagLabel(activeTag)} から`;
    // 直前と違うものを選ぶ
    const pool = base.length > 1 ? base.filter(i => i.id !== currentPickId) : base;
    idea = pool[Math.floor(Math.random() * pool.length)];
  }
  currentPickId = idea.id;

  document.getElementById('no-ideas-msg').style.display = 'none';
  const card = document.getElementById('ai-card');
  card.style.display = 'block';
  card.classList.remove('visible');
  requestAnimationFrame(() => requestAnimationFrame(() => card.classList.add('visible')));

  document.getElementById('card-eyebrow').textContent = eyebrow;
  document.getElementById('card-title').textContent = idea.title;
  document.getElementById('card-memo').textContent  = idea.memo || '';
  document.getElementById('card-date').textContent  = formatDate(idea.createdAt);
  renderCardTags(idea);

  await fetchAIComment(idea);
}

function renderCardTags(idea) {
  document.getElementById('card-tags').innerHTML =
    tagsOf(idea).map(t => `<span class="card-tag">${escHtml(t)}</span>`).join(' ');
}

// 一覧の「💬 コメント」：そのアイデアをカードに出して、カードまでスクロール
function commentOn(id) {
  const idea = loadIdeas().find(i => i.id === id);
  if (!idea) return;
  pickRandom(idea);
  requestAnimationFrame(() =>
    document.getElementById('ai-card').scrollIntoView({ behavior: 'smooth', block: 'start' }));
}

async function regenComment() {
  const ideas = loadIdeas();
  const idea  = ideas.find(i => i.id === currentPickId);
  if (!idea) return;
  await fetchAIComment(idea);
}

/* ── コメントの切り口 ── */
function ideaBlock(idea, heading = '') {
  return `${heading}アイデアタイトル：${idea.title}
メモ：${idea.memo || '（なし）'}
タグ：${tagsOf(idea).join(', ') || '（なし）'}
記録日：${formatDate(idea.createdAt)}`;
}
const ANSWER_ONLY = '返答はコメント本文のみ。余計な前置きや「はい」「わかりました」は不要。';

const ANGLES = [
  {
    id: 'trend',
    label: '✨ 今の流れと照らし合わせる',
    build: idea => `あなたはアイデアの価値を見抜くコンサルタントです。
以下のアイデアを読み、2〜3文の短いコメントを書いてください。
コメントのポイント：
- 現在の技術・デザイン・創作・フリーランス・AI活用などのトレンドと照らし合わせて、このアイデアの今日的な価値や可能性を指摘する
- または、忘れていたこのアイデアを「今こそ」動かすきっかけになるような視点を提供する
- 日本語で、知的でドライな語り口で（ゆるすぎず、重すぎず）

${ideaBlock(idea)}

${ANSWER_ONLY}`,
  },
  {
    id: 'harsh',
    label: '🔥 辛口でツッコむ',
    build: idea => `あなたは率直で辛口な編集者です。
以下のアイデアを読み、弱点・甘いところ・見落としている点を2〜3文で遠慮なくツッコんでください。
コメントのポイント：
- 「誰が本当に欲しいのか」「なぜ今までなかったのか」「続けられるのか」など、痛いところを具体的に突く
- ただの否定で終わらせず、最後に「ここを詰めれば化ける」という一言を添える
- 日本語で、歯切れよく。人格ではなくアイデアに対して辛口に

${ideaBlock(idea)}

${ANSWER_ONLY}`,
  },
  {
    id: 'combine',
    label: '🧩 ほかのアイデアと掛け合わせる',
    build: (idea, partner) => `あなたは発想を広げるのが得意なクリエイティブディレクターです。
同じ人が書きためた2つのアイデアを掛け合わせて、新しい組み合わせ案を出してください。
コメントのポイント：
- 2つを組み合わせた具体的な案を1つ、2〜4文で示す（何を作るか・誰に届くかがわかるように）

${ideaBlock(idea, '【アイデアA】\n')}

${ideaBlock(partner, '【アイデアB】\n')}

${ANSWER_ONLY}`,
  },
  {
    id: 'step',
    label: '🌱 今日5分でできる小さな一歩',
    build: idea => `あなたは行動を後押しするコーチです。
以下のアイデアを前に進めるために、今日5分でできる小さな一歩を1つだけ提案してください。
コメントのポイント：
- 道具や準備がいらず、5分で終わる具体的な行動にする（例：「〇〇を3つ書き出す」「〇〇で検索して1つメモする」）
- なぜそれが最初の一歩に向いているかを一言添える

const ANGLE_KEY = 'ginsprout_idea_angle_v1';
let currentAngle = (() => {
  try { const v = localStorage.getItem(ANGLE_KEY); return ANGLES.some(a => a.id === v) ? v : 'trend'; }
  catch { return 'trend'; }
})();

function renderAngleChips() {
  document.getElementById('angle-chips').innerHTML = ANGLES.map(a =>
    `<button type="button" class="angle-chip${a.id === currentAngle ? ' active' : ''}" data-angle="${a.id}" aria-pressed="${a.id === currentAngle}">${escHtml(a.label)}</button>`
  ).join('');
}

function setAngle(id) {
  if (!ANGLES.some(a => a.id === id)) return;
  currentAngle = id;
  try { localStorage.setItem(ANGLE_KEY, id); } catch { /* 覚えられなくても動く */ }
  renderAngleChips();
  regenComment();
}

let commentSeq = 0; // 新しいコメントを頼んだら、古い返事は表示しない

async function fetchAIComment(idea) {
  const seq = ++commentSeq;
  const el = document.getElementById('ai-comment');
  const labelEl = document.getElementById('ai-label');
  el.innerHTML = '<span class="spinner"></span>';

  let angle = ANGLES.find(a => a.id === currentAngle) || ANGLES[0];
  let partner = null;
  let note = '';
  if (angle.id === 'combine') {
    const others = loadIdeas().filter(i => i.id !== idea.id);
    if (others.length) {
      partner = others[Math.floor(Math.random() * others.length)];
      note = ` × 「${partner.title}」`;
    } else {
      angle = ANGLES[0];
      note = '（掛け合わせる相手がまだないので）';
    }
  }
  labelEl.textContent = `AI comment — ${angle.label}${note}`;

  try {
    const text = await callAI(angle.build(idea, partner));
    if (seq !== commentSeq) return;
    typewrite(el, text || 'コメントを取得できませんでした。', 0, seq);
  } catch (e) {
    if (seq !== commentSeq) return;
    el.textContent = 'AIコメントを取得できませんでした（オフライン？）';
  }
}

function typewrite(el, text, i = 0, seq = commentSeq) {
  if (seq !== commentSeq) return; // 別のコメントに切り替わった
  if (i >= text.length) return;
  el.textContent = text.slice(0, i + 1);
  const cursor = document.createElement('span');
  cursor.className = 'cursor';
  el.appendChild(cursor);
  const delay = text[i] === '。' || text[i] === '、' ? 60 : 18;
  setTimeout(() => typewrite(el, text, i + 1, seq), delay);
}

/* ── アーカイブ ── */
let activeTag = null; // null = すべて / UNTAGGED = 未分類 / それ以外 = そのタグ

function renderFilterBar(ideas) {
  const bar = document.getElementById('filter-bar');
  if (!ideas.length) { bar.innerHTML = ''; activeTag = null; return; }

  const counts = new Map();
  for (const i of ideas) for (const t of tagsOf(i)) counts.set(t, (counts.get(t) || 0) + 1);
  const untagged = ideas.filter(i => !tagsOf(i).length).length;
  // 絞り込み中のタグがなくなったら「すべて」に戻す
  if (activeTag && activeTag !== UNTAGGED && !counts.has(activeTag)) activeTag = null;

  // ジャンル候補の順 → それ以外のタグは件数の多い順
  const order = t => { const g = GENRES.indexOf(t); return g === -1 ? GENRES.length : g; };
  const tags = [...counts.keys()].sort((a, b) =>
    order(a) - order(b) || counts.get(b) - counts.get(a) || a.localeCompare(b, 'ja'));

  const chip = (value, label, count) => {
    const on = activeTag === value;
    return `<button type="button" class="filter-chip${on ? ' active' : ''}" data-tag="${escHtml(value ?? '')}" aria-pressed="${on}">${escHtml(label)}<span class="count">${count}</span></button>`;
  };
  bar.innerHTML = [
    chip(null, 'すべて', ideas.length),
    chip(UNTAGGED, '未分類', untagged),
    ...tags.map(t => chip(t, t, counts.get(t))),
  ].join('');
}

function renderBulkRow(ideas) {
  const row = document.getElementById('bulk-row');
  const n = ideas.filter(i => !tagsOf(i).length).length;
  const showBtn = n > 0 || bulkRunning;
  row.innerHTML =
    (showBtn ? `<button type="button" class="btn-backup" onclick="bulkTag()"${bulkRunning ? ' disabled' : ''}>✦ タグなしのアイデアにまとめてタグ付け（${n}件）</button>` : '') +
    (bulkProgress ? `<span class="bulk-progress" role="status" aria-live="polite">${escHtml(bulkProgress)}</span>` : '');
}

function renderArchive() {
  const ideas = loadIdeas();
  const list  = document.getElementById('archive-list');
  const label = document.getElementById('archive-count-label');

  renderFilterBar(ideas);
  renderBulkRow(ideas);

  const shown = filterIdeas(ideas, activeTag);
  label.textContent = activeTag
    ? `すべてのアイデア（${ideas.length}件中「${tagLabel(activeTag)}」${shown.length}件）`
    : `すべてのアイデア（${ideas.length}件）`;

  if (!ideas.length) { list.innerHTML = ''; return; }
  if (!shown.length) {
    list.innerHTML = `<div class="archive-empty">「${escHtml(tagLabel(activeTag))}」のアイデアはありません</div>`;
    return;
  }

  list.innerHTML = shown.map(idea => `
    <div class="archive-item" data-id="${idea.id}">
      <div class="archive-title">${escHtml(idea.title)}</div>
      ${idea.memo ? `<div class="archive-memo">${escHtml(idea.memo)}</div>` : ''}
      ${tagsOf(idea).length ? `<div class="archive-tags">${tagsOf(idea).map(t=>`<span class="archive-tag">${escHtml(t)}</span>`).join('')}</div>` : ''}
      <div class="archive-meta" style="grid-column:1">${formatDate(idea.createdAt)}</div>
      <div class="archive-btns">
        <button class="btn-comment" onclick="commentOn(${idea.id})" title="AIにコメントをもらう">💬 コメント</button>
        <button class="btn-edit" onclick="openEdit(${idea.id})" title="編集">✎ 編集</button>
        <button class="btn-del"  onclick="deleteIdea(${idea.id})" title="削除">× 削除</button>
      </div>
    </div>
  `).join('');
}

function toggleArchive(forceOpen) {
  const list  = document.getElementById('archive-list');
  const arrow = document.getElementById('toggle-arrow');
  const open  = forceOpen === true ? list.classList.toggle('open', true) : list.classList.toggle('open');
  arrow.classList.toggle('open', open);
}

function setFilter(tag) {
  activeTag = tag || null;
  renderArchive();
  toggleArchive(true); // 絞り込んだら一覧を開いて見せる
}

function deleteIdea(id) {
  const ideas = loadIdeas().filter(i => i.id !== id);
  writeDeleted(mergeDeleted(loadDeleted(), [{ id, deletedAt: new Date().toISOString() }]));
  saveIdeas(ideas);
  showToast('削除しました');
  renderAll();
}

/* ── 編集モーダル ── */
let editingId = null;

function openEdit(id) {
  const idea = loadIdeas().find(i => i.id === id);
  if (!idea) return;
  editingId = id;
  document.getElementById('edit-title').value = idea.title;
  document.getElementById('edit-memo').value  = idea.memo || '';
  document.getElementById('edit-tag').value   = tagsOf(idea).join(' ');
  renderEditGenres();
  document.getElementById('edit-modal').classList.add('show');
  document.getElementById('edit-title').focus();
}

function closeModal() {
  document.getElementById('edit-modal').classList.remove('show');
  editingId = null;
}

function saveEdit() {
  const title = document.getElementById('edit-title').value.trim();
  if (!title) { showToast('タイトルを入力してください'); return; }
  const memo   = document.getElementById('edit-memo').value.trim();
  const tags   = parseTagInput(document.getElementById('edit-tag').value);
  const ideas = loadIdeas().map(i =>
    i.id === editingId ? { ...i, title, memo, tags, updatedAt: new Date().toISOString() } : i
  );
  saveIdeas(ideas);
  closeModal();
  showToast('更新しました');
  renderAll();
}

// 編集画面のジャンルボタン：押すとタグ欄につけ外しする
function renderEditGenres() {
  const tags = parseTagInput(document.getElementById('edit-tag').value);
  document.getElementById('edit-genres').innerHTML = GENRES.map(g => {
    const on = tags.includes(g);
    return `<button type="button" class="modal-genre${on ? ' active' : ''}" data-genre="${escHtml(g)}" aria-pressed="${on}">${escHtml(g)}</button>`;
  }).join('');
}

function toggleEditGenre(genre) {
  const input = document.getElementById('edit-tag');
  const tags = parseTagInput(input.value);
  input.value = (tags.includes(genre) ? tags.filter(t => t !== genre) : [...tags, genre]).join(' ');
  renderEditGenres();
}

/* ── バックアップ／復元 ── */
function exportIdeas() {
  const ideas = loadIdeas();
  if (!ideas.length) { showToast('バックアップするアイデアがありません'); return; }

  const blob = new Blob([JSON.stringify(ideas, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, '');

  const a = document.createElement('a');
  a.href = url;
  a.download = `idea-catcher-backup_${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);

  showToast('バックアップをダウンロードしました');
}

function importIdeas(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    let imported;
    try { imported = JSON.parse(reader.result); }
    catch { showToast('ファイルを読み込めませんでした'); return; }
    if (!Array.isArray(imported)) { showToast('バックアップファイルの形式が正しくありません'); return; }

    const current = loadIdeas();
    const existingIds = new Set(current.map(i => i.id));
    const wasDeleted = new Set(loadDeleted().map(d => d.id));
    const now = new Date().toISOString();
    // 前に削除したアイデアも、復元したなら「今直した」扱いにして同期で消えないようにする
    const newOnes = imported.filter(i => i && i.id && !existingIds.has(i.id))
      .map(i => wasDeleted.has(i.id) ? { ...i, updatedAt: now } : i);
    saveIdeas(current.concat(newOnes));
    renderAll();

    showToast(newOnes.length ? `${newOnes.length}件のアイデアを復元しました` : '新しいアイデアはありませんでした');
  };
  reader.readAsText(file);
  event.target.value = '';
}

/* ── テキスト書き出し ── */
function exportText() {
  const ideas = loadIdeas();
  if (!ideas.length) { showToast('書き出すアイデアがありません'); return; }

  const text = ideas.map(idea => {
    const lines = [`■ ${idea.title}`, formatDate(idea.createdAt)];
    if (idea.tags.length) lines.push(`タグ: ${idea.tags.join(', ')}`);
    if (idea.memo) lines.push('', idea.memo);
    return lines.join('\n');
  }).join('\n\n----------------------------------------\n\n');

  const BOM = '\uFEFF';
  const blob = new Blob([BOM + text], { type: 'text/plain;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, '');

  const a = document.createElement('a');
  a.href = url;
  a.download = `idea-catcher_${stamp}.txt`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);

  showToast('テキストをダウンロードしました');
}

/* ── PDF書き出し（html2canvas + jsPDFで画像として組版、日本語も正しく表示） ── */
async function exportPDF() {
  const ideas = loadIdeas();
  if (!ideas.length) { showToast('書き出すアイデアがありません'); return; }
  if (!window.html2canvas || !window.jspdf) { showToast('PDF機能の読み込みに失敗しました（オフライン？）'); return; }

  showToast('PDFを作成中…');

  const sheet = document.createElement('div');
  sheet.style.cssText = 'position:fixed; left:-9999px; top:0; width:700px; background:#fff; color:#1a1a2e; font-family:"Noto Serif JP", serif; padding:36px;';
  sheet.innerHTML = `
    <div style="font-size:20px; font-weight:500; margin-bottom:6px;">Ginsprout — Idea Catcher</div>
    <div style="font-size:11px; color:#888; margin-bottom:28px;">書き出し日: ${formatDate(new Date().toISOString())}（全${ideas.length}件）</div>
    ${ideas.map(idea => `
      <div style="margin-bottom:22px; padding-bottom:18px; border-bottom:1px solid #ddd;">
        <div style="font-size:15px; font-weight:500; margin-bottom:6px;">${escHtml(idea.title)}</div>
        <div style="font-size:10.5px; color:#888; margin-bottom:8px;">${formatDate(idea.createdAt)}${idea.tags.length ? '　／　' + idea.tags.map(escHtml).join('、') : ''}</div>
        ${idea.memo ? `<div style="font-size:12px; line-height:1.8; white-space:pre-wrap;">${escHtml(idea.memo)}</div>` : ''}
      </div>
    `).join('')}
  `;
  document.body.appendChild(sheet);

  try {
    const canvas = await html2canvas(sheet, { scale: 2, backgroundColor: '#ffffff' });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'pt', 'a4');
    const pageWidth  = pdf.internal.pageSize.getWidth();
    const pageHeight = pdf.internal.pageSize.getHeight();
    const imgWidth   = pageWidth;
    const imgHeight  = canvas.height * imgWidth / canvas.width;
    const imgData    = canvas.toDataURL('image/png');

    let heightLeft = imgHeight;
    let position = 0;
    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
    heightLeft -= pageHeight;

    while (heightLeft > 0) {
      position = heightLeft - imgHeight;
      pdf.addPage();
      pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
      heightLeft -= pageHeight;
    }

    const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    pdf.save(`idea-catcher_${stamp}.pdf`);
    showToast('PDFをダウンロードしました');
  } catch (e) {
    showToast('PDFの作成に失敗しました');
  } finally {
    sheet.remove();
  }
}

function escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderAll() {
  renderArchive();
  // ピックアップを更新（カードが見えているなら）
  const ideas = loadIdeas();
  if (!ideas.length) {
    document.getElementById('ai-card').style.display = 'none';
    document.getElementById('no-ideas-msg').style.display = 'block';
  } else if (document.getElementById('ai-card').style.display !== 'none') {
    // カードが表示中なら現在のアイデアが残っているかチェック
    const current = ideas.find(i => i.id === currentPickId);
    if (!current) pickRandom();
    else renderCardTags(current); // 自動タグ付けなどでタグが変わったとき
  }
}

/* ── 初期化 ── */
window.addEventListener('load', () => {
  renderAngleChips();
  renderArchive();
  pickRandom();
  renderSyncSection();
  Sync.load();

  document.getElementById('filter-bar').addEventListener('click', e => {
    const b = e.target.closest('.filter-chip');
    if (b) setFilter(b.dataset.tag);
  });
  document.getElementById('angle-chips').addEventListener('click', e => {
    const b = e.target.closest('.angle-chip');
    if (b) setAngle(b.dataset.angle);
  });
  document.getElementById('edit-genres').addEventListener('click', e => {
    const b = e.target.closest('.modal-genre');
    if (b) toggleEditGenre(b.dataset.genre);
  });
  document.getElementById('edit-tag').addEventListener('input', renderEditGenres);

  // Enterキーで保存
  // モーダル背景クリックで閉じる
  document.getElementById('edit-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('edit-modal')) closeModal();
  });

  document.getElementById('inp-title').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      document.getElementById('inp-memo').focus();
    }
  });
});
